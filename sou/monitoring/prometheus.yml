global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'soy-nginx-monitor'
    environment: 'docker-swarm'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # Gateway nginx VTS
  - job_name: 'gateway-nginx-vts'
    static_configs:
      - targets: ['gateway-nginx:80']
    scrape_interval: 5s
    metrics_path: /vts_status
    relabel_configs:
      - target_label: service
        replacement: gateway

  # MS-Exercise nginx VTS
  - job_name: 'ms-exercise-nginx-vts'
    static_configs:
      - targets: ['ms-exercise-nginx:5001']
    scrape_interval: 5s
    metrics_path: /vts_status
    relabel_configs:
      - target_label: service
        replacement: ms-exercise

  # MS-Other nginx VTS
  - job_name: 'ms-other-nginx-vts'
    static_configs:
      - targets: ['ms-other-nginx:8080']
    scrape_interval: 5s
    metrics_path: /vts_status
    relabel_configs:
      - target_label: service
        replacement: ms-other

  # cAdvisor
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']