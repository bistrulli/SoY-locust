events {
    worker_connections 1024;
}

http {
    # Enable VTS module (minimal config)
    vhost_traffic_status_zone;
    
    upstream gateway_backend {
        server gateway:8080;
    }

    # auth / user service: the Express gateway (v5-gw-mod) does NOT route /api/user/*
    # nor /api/auth/* (they fall to its dead React catch-all → 404). ms-other handles
    # them, so we route those paths to it directly at the nginx level.
    upstream auth_backend {
        server ms-other-nginx:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/user/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
        
        # VTS status endpoint 
        location /vts_status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format prometheus;
            access_log off;
            allow all;
        }
    }
}