events {
    worker_connections 1024;
}

http {
    # Enable VTS module (minimal config)
    vhost_traffic_status_zone;

    # A static `upstream { server ms-exercise:5001; }` resolves Docker's embedded DNS
    # ONCE at boot and caches that single replica IP forever, so scaling `ms-exercise`
    # afterward (the harness scales AFTER deploy) never adds replicas to the pool —
    # all traffic pins to replica-1 and the others sit idle (fake autoscaling savings).
    # Same bug/fix as the Envoy sidecars (commit 11fc8f8) and the shop's nginx sidecars
    # (proxy/nginx/*.conf): re-resolve via the Docker resolver + a proxy_pass variable.
    resolver 127.0.0.11 valid=5s ipv6=off;   # Docker embedded DNS; re-resolve every 5s

    server {
        listen 5001;
        server_name localhost;

        location / {
            set $backend ms-exercise:5001;   # variable => dynamic resolution => spreads across replicas
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
        
        # VTS status endpoint
        location /vts_status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format prometheus;
            access_log off;
            allow all;
        }
    }
}