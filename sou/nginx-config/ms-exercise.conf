events {
    worker_connections 1024;
}

http {
    # Enable VTS module
    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_host on;
    vhost_traffic_status_filter_by_set_key $request_uri uri::main;
    
    upstream ms_exercise_backend {
        # VTS upstream monitoring
        vhost_traffic_status_upstream_zone server ms-exercise:5001;
        server ms-exercise:5001;
    }

    server {
        listen 5001;
        server_name localhost;

        location / {
            proxy_pass http://ms_exercise_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
        
        # VTS status endpoint
        location /vts_status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
            access_log off;
            allow all;
        }
    }
}